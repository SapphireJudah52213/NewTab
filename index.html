<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>New Tab</title>

<style>

/* ============================================================
   VARIABLES
   ============================================================ */

:root {

    --accent: #8ab4f8;

    --orb-size: 520px;
    --orb-opacity: .72;
    --orb-x: 50%;
    --orb-y: 38%;

    --orb-softness: 45%;
    --orb-glow: 1;

    --orb-background: transparent;
    --orb-ambient: transparent;
    --orb-center: transparent;

    --background-blur: 0px;

    --text: #fff;
    --muted: #999;

    --border:
        rgba(255,255,255,.11);

    --transparency: .58;
    --blur: 10px;
}


/* ============================================================
   RESET
   ============================================================ */

* {
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;
}

body {

    overflow: hidden;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color:
        var(--text);

    background:
        #0c0d10;
}


/* ============================================================
   BACKGROUND
   ============================================================ */

.background-image {

    position: fixed;

    inset: 0;

    z-index: -5;

    background-size: cover;
    background-position: center;

    opacity: 0;

    transition:
        opacity .25s ease;
}

.background-overlay {

    position: fixed;

    inset: 0;

    z-index: -4;

    pointer-events: none;

    background:
        rgba(0,0,0,.22);
}


/* ============================================================
   ORB
   ============================================================ */

.orb {

    position: fixed;

    z-index: -3;

    width: var(--orb-size);
    height: var(--orb-size);

    left: var(--orb-x);
    top: var(--orb-y);

    transform:
        translate3d(-50%, -50%, 0);

    pointer-events: none;

    opacity:
        var(--orb-opacity);

    border-radius: 50%;

    background:
        var(--orb-background);

    mask-image:
        radial-gradient(
            circle at center,
            black 0%,
            black 25%,
            rgba(0,0,0,.85) 40%,
            rgba(0,0,0,.35) 62%,
            transparent 88%
        );

    -webkit-mask-image:
        radial-gradient(
            circle at center,
            black 0%,
            black 25%,
            rgba(0,0,0,.85) 40%,
            rgba(0,0,0,.35) 62%,
            transparent 88%
        );
}


/* ============================================================
   ORB CENTRAL LIGHT
   ============================================================ */

.orb::before {

    content: "";

    position: absolute;

    inset: 15%;

    border-radius: 50%;

    background:
        var(--orb-center);

    opacity:
        calc(var(--orb-glow) * .8);
}


/* ============================================================
   ORB AMBIENT LIGHT
   ============================================================ */

.orb::after {

    content: "";

    position: absolute;

    inset: -45%;

    border-radius: 50%;

    background:
        var(--orb-ambient);

    opacity:
        calc(var(--orb-glow) * .75);

    filter:
        blur(22px);
}


/* ============================================================
   ORB PREVIEW
   ============================================================ */

.orb-preview {

    width: 100%;
    height: 110px;

    margin-bottom: 18px;

    border:
        1px solid var(--border);

    border-radius: 16px;

    overflow: hidden;

    background:
        #0d0e11;

    position: relative;
}

.orb-preview::before {

    content: "";

    position: absolute;

    width: 190px;
    height: 190px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        var(--orb-background);

    mask-image:
        radial-gradient(
            circle,
            black 0%,
            black 25%,
            transparent 85%
        );

    -webkit-mask-image:
        radial-gradient(
            circle,
            black 0%,
            black 25%,
            transparent 85%
        );

    filter:
        blur(5px);
}

.orb-preview::after {

    content: "";

    position: absolute;

    inset: -40%;

    background:
        var(--orb-ambient);

    filter:
        blur(12px);
}


/* ============================================================
   PAGE
   ============================================================ */

.page {

    position:
        relative;

    z-index:
        2;

    width:
        100%;

    height:
        100%;

    padding:
        22px;

    display:
        flex;

    flex-direction:
        column;
}


/* ============================================================
   TOP BAR
   ============================================================ */

.topbar {

    display:
        flex;

    justify-content:
        flex-end;

    gap:
        8px;
}

.top-button {

    width:
        42px;

    height:
        42px;

    border:
        1px solid var(--border);

    border-radius:
        50%;

    background:
        rgba(25,25,28,var(--transparency));

    color:
        white;

    cursor:
        pointer;

    font-size:
        18px;

    backdrop-filter:
        blur(var(--blur));

    -webkit-backdrop-filter:
        blur(var(--blur));

    transition:
        transform .15s ease,
        background .15s ease;
}

.top-button:hover {

    transform:
        scale(1.05);

    background:
        rgba(55,55,60,var(--transparency));
}


/* ============================================================
   CENTER
   ============================================================ */

.center {

    width:
        min(720px, 100%);

    margin:
        auto;

    transform:
        translateY(-30px);
}


/* ============================================================
   CLOCK
   ============================================================ */

.clock {

    position: fixed;

    top: -210px;

    left: 50%;

    transform:
        translateX(-50%);

    color:
        rgba(255,255,255,.7);

    font-size:
        20px;

    font-variant-numeric:
        tabular-nums;
}


/* ============================================================
   LOGO
   ============================================================ */

.logo {

    text-align:
        center;

    margin-bottom:
        28px;

    font-size:
        clamp(44px, 9vw, 78px);

    font-weight:
        650;

    letter-spacing:
        -4px;

    text-shadow:
        0 0 28px
        color-mix(
            in srgb,
            var(--accent) 20%,
            transparent
        );
}


/* ============================================================
   SEARCH
   ============================================================ */

.search {

    width:
        100%;

    height:
        58px;

    display:
        flex;

    align-items:
        center;

    padding:
        0 17px;

    border:
        1px solid var(--border);

    border-radius:
        30px;

    background:
        rgba(25,25,29,var(--transparency));

    backdrop-filter:
        blur(var(--blur));

    -webkit-backdrop-filter:
        blur(var(--blur));

    transition:
        border-color .15s ease;
}

.search:focus-within {

    border-color:
        color-mix(
            in srgb,
            var(--accent) 55%,
            transparent
        );
}

.search-icon {

    margin-right:
        11px;

    color:
        white;
}

.search input {

    flex:
        1;

    height:
        100%;

    border:
        0;

    outline:
        0;

    background:
        transparent;

    color:
        white;

    font-size:
        16px;
}

.search input::placeholder {

    color:
        #888;
}

.search-key {

    color:
        #777;

    border:
        1px solid #444;

    border-radius:
        6px;

    padding:
        4px 7px;

    font-size:
        10px;
}


/* ============================================================
   SHORTCUTS
   ============================================================ */

.shortcuts {

    margin-top:
        24px;

    display:
        grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(125px, 1fr)
        );

    gap:
        11px;
}

.shortcut {

    position:
        relative;

    min-width:
        0;

    padding:
        14px;

    border:
        1px solid var(--accent);

    border-radius:
        16px;

    background:
        rgba(25,25,29,var(--transparency));

    backdrop-filter:
        blur(var(--blur));

    -webkit-backdrop-filter:
        blur(var(--blur));

    cursor:
        pointer;

    user-select:
        none;

    transition:
        transform .14s ease,
        background .14s ease;
}

.shortcut:hover {

    transform:
        translateY(-2px);

    background:
        rgba(50,50,55,var(--transparency));
}

.shortcut.dragging {

    opacity:
        .35;
}

.shortcut-icon {

    width:
        38px;

    height:
        38px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    margin-bottom:
        9px;

    border-radius:
        10px;

    background:
        rgba(255,255,255,.08);

    overflow:
        hidden;
}

.shortcut-icon img {

    width:
        24px;

    height:
        24px;

    object-fit:
        contain;
}

.shortcut-fallback {

    font-size:
        17px;

    font-weight:
        650;
}

.shortcut-name {

    font-size:
        14px;

    font-weight:
        550;

    overflow:
        hidden;

    text-overflow:
        ellipsis;

    white-space:
        nowrap;
}

.shortcut-url {

    margin-top:
        4px;

    color:
        var(--muted);

    font-size:
        11px;

    overflow:
        hidden;

    text-overflow:
        ellipsis;

    white-space:
        nowrap;
}

.shortcut-menu {

    position:
        absolute;

    right:
        7px;

    top:
        7px;

    width:
        25px;

    height:
        25px;

    border:
        0;

    border-radius:
        50%;

    background:
        transparent;

    color:
        #aaa;

    cursor:
        pointer;

    opacity:
        0;
}

.shortcut:hover
.shortcut-menu {

    opacity:
        1;
}


/* ============================================================
   FOOTER
   ============================================================ */

.footer {

    text-align:
        center;

    padding-top:
        12px;

    color:
        #555;

    font-size:
        10px;
}


/* ============================================================
   OVERLAY
   ============================================================ */

.overlay {

    position:
        fixed;

    inset:
        0;

    z-index:
        20;

    display:
        none;

    background:
        rgba(0,0,0,.15);
}

.overlay.open {

    display:
        block;
}


/* ============================================================
   SETTINGS PANEL
   ============================================================ */

.settings {

    position:
        fixed;

    z-index:
        100;

    right:
        18px;

    top:
        72px;

    width:
        390px;

    max-width:
        calc(100vw - 30px);

    max-height:
        calc(100vh - 90px);

    overflow-y:
        auto;

    padding:
        14px;

    border:
        1px solid var(--border);

    border-radius:
        20px;

    background:
        rgba(20,20,23,var(--transparency));

    backdrop-filter:
        blur(var(--blur));

    -webkit-backdrop-filter:
        blur(var(--blur));

    box-shadow:
        0 25px 70px rgba(0,0,0,.55);

    display:
        none;

    scrollbar-width:
        thin;
}

.settings.open {

    display:
        block;
}


/* ============================================================
   SETTINGS HEADER
   ============================================================ */

.settings-header {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    padding:
        7px 7px 14px;
}

.settings h2 {

    margin:
        0;

    font-size:
        20px;
}

.settings-subtitle {

    margin-top:
        3px;

    color:
        #777;

    font-size:
        11px;
}

.close-settings {

    width:
        34px;

    height:
        34px;

    border:
        0;

    border-radius:
        50%;

    background:
        rgba(255,255,255,.06);

    color:
        #aaa;

    font-size:
        22px;

    cursor:
        pointer;
}

.close-settings:hover {

    background:
        rgba(255,255,255,.1);

    color:
        white;
}


/* ============================================================
   SETTINGS SECTIONS
   ============================================================ */

.settings-section {

    border:
        1px solid rgba(255,255,255,.08);

    border-radius:
        14px;

    margin-bottom:
        9px;

    overflow:
        hidden;

    background:
        rgba(255,255,255,.025);
}

.settings-section summary {

    list-style:
        none;

    cursor:
        pointer;

    padding:
        14px;

    display:
        flex;

    align-items:
        center;

    gap:
        10px;

    font-size:
        13px;

    font-weight:
        650;

    user-select:
        none;
}

.settings-section summary::-webkit-details-marker {
    display: none;
}

.settings-section summary::after {

    content:
        "›";

    margin-left:
        auto;

    font-size:
        18px;

    color:
        #777;

    transition:
        transform .18s ease;
}

.settings-section[open]
summary::after {

    transform:
        rotate(90deg);
}

.section-icon {

    width:
        28px;

    height:
        28px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border-radius:
        8px;

    background:
        rgba(255,255,255,.07);

    font-size:
        14px;
}

.section-content {

    padding:
        0 14px 14px;
}


/* ============================================================
   SETTINGS FIELDS
   ============================================================ */

.setting {

    margin-bottom:
        15px;
}

.setting:last-child {

    margin-bottom:
        0;
}

.setting label {

    display:
        block;

    margin-bottom:
        7px;

    color:
        #aaa;

    font-size:
        12px;
}

.setting-description {

    margin:
        -3px 0 8px;

    color:
        #666;

    font-size:
        10px;

    line-height:
        1.4;
}

.setting input,
.setting select {

    width:
        100%;

    padding:
        10px;

    border:
        1px solid #414146;

    border-radius:
        9px;

    background:
        #121214;

    color:
        white;

    outline:
        none;
}

.setting input:focus,
.setting select:focus {

    border-color:
        var(--accent);
}


/* ============================================================
   RANGE
   ============================================================ */

.range-row {

    display:
        flex;

    align-items:
        center;

    gap:
        10px;
}

.range-row input {

    flex:
        1;
}

.range-value {

    width:
        55px;

    text-align:
        right;

    color:
        #aaa;

    font-size:
        11px;
}


/* ============================================================
   COLOR PICKER
   ============================================================ */

.color-row {

    display:
        flex;

    gap:
        8px;
}

.color-row input[type="text"] {

    flex:
        1;
}

.color-row input[type="color"] {

    flex:
        0 0 48px;

    padding:
        3px;

    cursor:
        pointer;
}


/* ============================================================
   ORB COLOR LIST
   ============================================================ */

.orb-colors {

    display:
        flex;

    flex-direction:
        column;

    gap:
        8px;
}

.orb-color {

    display:
        grid;

    grid-template-columns:
        34px 1fr 42px;

    gap:
        8px;

    align-items:
        center;

    padding:
        7px;

    border:
        1px solid rgba(255,255,255,.07);

    border-radius:
        11px;

    background:
        rgba(255,255,255,.025);
}

.orb-color-number {

    width:
        28px;

    height:
        28px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border-radius:
        8px;

    background:
        rgba(255,255,255,.07);

    color:
        #999;

    font-size:
        11px;

    font-weight:
        600;
}

.orb-color input[type="text"] {

    width:
        100%;

    padding:
        8px;

    border:
        1px solid #414146;

    border-radius:
        8px;

    background:
        #121214;

    color:
        white;

    outline:
        none;

    font-family:
        monospace;

    font-size:
        12px;
}

.orb-color input[type="text"]:focus {

    border-color:
        var(--accent);
}

.orb-color input[type="color"] {

    width:
        42px;

    height:
        34px;

    padding:
        3px;

    border:
        1px solid #414146;

    border-radius:
        8px;

    background:
        #121214;

    cursor:
        pointer;
}

.color-controls {

    display:
        flex;

    gap:
        8px;

    margin-top:
        10px;
}

.color-controls button {

    flex:
        1;

    padding:
        9px;

    border:
        1px solid #444;

    border-radius:
        9px;

    background:
        rgba(255,255,255,.04);

    color:
        white;

    cursor:
        pointer;
}

.color-controls button:hover {

    background:
        rgba(255,255,255,.08);
}

.color-controls button:disabled {

    opacity:
        .35;

    cursor:
        not-allowed;
}

.color-count {

    margin-top:
        8px;

    color:
        #666;

    font-size:
        10px;

    text-align:
        center;
}


/* ============================================================
   BUTTONS
   ============================================================ */

.primary-button,
.secondary-button,
.danger-button {

    width:
        100%;

    padding:
        11px;

    border-radius:
        10px;

    cursor:
        pointer;
}

.primary-button {

    border:
        0;

    background:
        var(--accent);

    color:
        #111;

    font-weight:
        650;
}

.secondary-button {

    margin-top:
        8px;

    border:
        1px solid #444;

    background:
        transparent;

    color:
        white;
}

.secondary-button:hover {

    background:
        rgba(255,255,255,.06);
}

.danger-button {

    margin-top:
        8px;

    border:
        1px solid #633;

    background:
        rgba(120,20,20,.9);

    color:
        #ffaaaa;
}


/* ============================================================
   BACKGROUND PICKER
   ============================================================ */

.background-picker {

    display:
        flex;

    gap:
        8px;
}

.background-picker button {

    width:
        auto;

    flex:
        1;
}

.background-file-name {

    margin-top:
        7px;

    color:
        #777;

    font-size:
        11px;

    overflow:
        hidden;

    text-overflow:
        ellipsis;

    white-space:
        nowrap;
}


/* ============================================================
   SETTINGS FOOTER
   ============================================================ */

.settings-actions {

    margin-top:
        12px;

    padding-top:
        12px;

    border-top:
        1px solid rgba(255,255,255,.08);
}


/* ============================================================
   DIALOG
   ============================================================ */

.dialog {

    position:
        fixed;

    z-index:
        200;

    left:
        50%;

    top:
        50%;

    transform:
        translate(-50%,-50%);

    width:
        360px;

    max-width:
        calc(100vw - 30px);

    padding:
        22px;

    border:
        1px solid var(--border);

    border-radius:
        20px;

    background:
        rgba(20,20,23,var(--transparency));

    backdrop-filter:
        blur(var(--blur));

    -webkit-backdrop-filter:
        blur(var(--blur));

    box-shadow:
        0 30px 80px rgba(0,0,0,.6);

    display:
        none;
}

.dialog.open {

    display:
        block;
}

.dialog h2 {

    margin-top:
        0;
}


/* ============================================================
   MOBILE
   ============================================================ */

@media (max-width: 600px) {

    .page {

        padding:
            14px;
    }

    .center {

        transform:
            translateY(-12px);
    }

    .logo {

        margin-bottom:
            22px;
    }

    .search {

        height:
            54px;
    }

    .search-key {

        display:
            none;
    }

    .shortcuts {

        grid-template-columns:
            repeat(2, 1fr);

        max-height:
            270px;

        overflow-y:
            auto;
    }

    .settings {

        right:
            10px;

        top:
            62px;

        max-width:
            calc(100vw - 20px);

        width:
            390px;
    }

    .orb-color {

        grid-template-columns:
            30px 1fr 40px;
    }
}

</style>
</head>


<body>


<!-- ============================================================
     BACKGROUND
     ============================================================ -->

<div
    class="background-image"
    id="backgroundImage">
</div>

<div
    class="background-overlay">
</div>


<!-- ============================================================
     ORB
     ============================================================ -->

<div
    class="orb"
    id="orb">
</div>


<div
    class="overlay"
    id="overlay">
</div>


<!-- ============================================================
     MAIN PAGE
     ============================================================ -->

<div class="page">

    <div class="topbar">

        <button
            class="top-button"
            id="addButton"
            title="Add shortcut">
            +
        </button>

        <button
            class="top-button"
            id="settingsButton"
            title="Settings">
            ⚙
        </button>

    </div>


    <main class="center">

        <div
            class="clock"
            id="clock">
        </div>


        <div
            class="logo"
            id="logo">
            Chrome
        </div>


        <form
            class="search"
            id="searchForm">

            <div class="search-icon">

                <svg
                    focusable="false"
                    aria-hidden="true"
                    xmlns="http://www.w3.org/2000/svg"
                    height="24"
                    viewBox="0 0 24 24"
                    width="24">

                    <g>
                        <rect
                            fill="none"
                            height="24"
                            width="24">
                        </rect>
                    </g>

                    <g>

                        <path
                            d="M17.5 12c0-3.04 2.46-5.5 5.5-5.5-3.04 0-5.5-2.46-5.5-5.5 0 3.04-2.46 5.5-5.5 5.5 3.04 0 5.5 2.46 5.5 5.5z">
                        </path>

                        <path
                            d="M15.65 11.58c.18-.5.27-1.03.31-1.58h-2c-.1 1.03-.51 1.93-1.27 2.69-.88.87-1.94 1.31-3.19 1.31C7.03 14 5 12.07 5 9.5 5 7.03 6.93 5 9.5 5c.46 0 .89.08 1.3.2l1.56-1.56C11.5 3.22 10.55 3 9.5 3 5.85 3 3 5.85 3 9.5S5.85 16 9.5 16c.56 0 2.26-.06 3.8-1.3l6.3 6.3 1.4-1.4-6.3-6.3c.4-.5.72-1.08.95-1.72z">

/* ============================================================

function cloneDefault() {

function loadConfig() {

    try {

        const saved =
            localStorage.getItem(
                "customNewTabConfig"
            );

        if (!saved) {

            return cloneDefault();

        }

        const parsed =
            JSON.parse(saved);

        const defaults =
            cloneDefault();

        /*
         * Migrate old versions that used
         * orbColor1 / orbColor2 / orbColor3.
         */

        if (
            !Array.isArray(
                parsed.orbColors
            )
        ) {

            parsed.orbColors = [

                parsed.orbColor1 ||
                    defaults.orbColors[0],

                parsed.orbColor2 ||
                    defaults.orbColors[1],

                parsed.orbColor3 ||
                    defaults.orbColors[2]

            ];

        }

        delete parsed.orbColor1;
        delete parsed.orbColor2;
        delete parsed.orbColor3;

        const config = {

            ...defaults,
            ...parsed

        };

        config.orbColors =
            Array.isArray(config.orbColors)
                ? config.orbColors
                    .filter(validHex)
                    .slice(0, 8)
                : cloneDefault().orbColors;

        if (
            config.orbColors.length === 0
        ) {

            config.orbColors = [
                defaults.orbColors[0]
            ];

        }

        return config;

    } catch {

    }

}

/* ============================================================
   ELEMENTS
   ============================================================ */

    document.getElementById("backgroundImage");

/* ============================================================
   ORB GRADIENT GENERATOR
   ============================================================ */

function buildOrbGradients(colors) {

    const count =
        colors.length;

    const positions = [];

    /*
     * Evenly distribute the colors around
     * the orb rather than being locked to
     * exactly three positions.
     */

    for (
        let i = 0;
        i < count;
        i++
    ) {

        const angle =
            (Math.PI * 2 * i) /
            count;

        const x =
            Math.round(
                50 +
                Math.cos(angle - Math.PI / 2) * 27
            );

        const y =
            Math.round(
                50 +
                Math.sin(angle - Math.PI / 2) * 27
            );

        positions.push({
            x,
            y
        });

    }


    const gradients =
        colors.map(
            (color, index) => {

                const position =
                    positions[index];

                const strength =
                    Math.max(
                        55,
                        90 -
                        count * 2
                    );

                const fade =
                    Math.min(
                        65,
                        48 +
                        count * 2
                    );

                return `
                    radial-gradient(
                        circle at ${position.x}% ${position.y}%,
                        color-mix(
                            in srgb,
                            ${color} ${strength}%,
                            transparent
                        ) 0%,
                        transparent ${fade}%
                    )
                `;

            }
        );


    const ambientStops =
        colors.map(
            (color, index) => {

                const percentage =
                    Math.max(
                        7,
                        20 - index * 2
                    );

                const stop =
                    Math.min(
                        65,
                        8 + index * 7
                    );

                return `
                    color-mix(
                        in srgb,
                        ${color} ${percentage}%,
                        transparent
                    ) ${stop}%
                `;

            }
        );


    const centerColor =
        colors[0];


    root.style.setProperty(
        "--orb-background",
        gradients.join(",")
    );


    root.style.setProperty(
        "--orb-ambient",
        `
            radial-gradient(
                circle,
                ${ambientStops.join(",")},
                transparent 70%
            )
        `
    );


    root.style.setProperty(
        "--orb-center",
        `
            radial-gradient(
                circle,
                rgba(255,255,255,.38) 0%,
                color-mix(
                    in srgb,
                    ${centerColor} 35%,
                    transparent
                ) 18%,
                transparent 62%
            )
        `
    );

}


/* ============================================================
   APPLY CONFIG
   ============================================================ */

function applyConfig() {

    root.style.setProperty(
        "--accent",
        CONFIG.accent
    );

    root.style.setProperty(
        "--transparency",
        CONFIG.transparency
    );

    root.style.setProperty(

    );

    root.style.setProperty(
        "--orb-size",
        CONFIG.orbSize + "px"
    );

    root.style.setProperty(
        "--orb-opacity",
        CONFIG.orbOpacity
    );

    root.style.setProperty(
        "--orb-softness",
        CONFIG.orbSoftness + "%"
    );

    root.style.setProperty(
        "--orb-glow",
        CONFIG.orbGlow
    );

    root.style.setProperty(
        "--orb-x",
        CONFIG.orbX + "%"
    );

    root.style.setProperty(
        "--orb-y",
        CONFIG.orbY + "%"
    );

    root.style.setProperty(
        "--background-blur",
        CONFIG.backgroundBlur + "px"
    );


    buildOrbGradients(
        CONFIG.orbColors
    );


    logo.textContent =
        CONFIG.logo;


    if (
        CONFIG.background
    ) {

        backgroundImage.style.backgroundImage =
            `url("${CONFIG.background}")`;

        backgroundImage.style.filter =
            `blur(${CONFIG.backgroundBlur}px)`;

        backgroundImage.style.transform =
            "scale(1.03)";

    } else {

    }


    renderShortcuts();

    startClock();

}


/* ============================================================
   BACKGROUND FILE PICKER
   ============================================================ */

const browseBackground =
    document.getElementById(
        "browseBackground"
    );

const backgroundFile =
    document.getElementById(
        "backgroundFile"
    );

const removeBackground =
    document.getElementById(
        "removeBackground"
    );

const backgroundFileName =
    document.getElementById(
        "backgroundFileName"
    );


browseBackground.addEventListener(
    "click",
    () => {

        backgroundFile.click();

    }
);


backgroundFile.addEventListener(
    "change",
    event => {

        const file =
            event.target.files[0];

        if (!file) {
            return;
        }

        if (
            !file.type.startsWith(
                "image/"
            )
        ) {

            alert(
                "Please select an image file."
            );

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            () => {

                const dataURL =
                    reader.result;


                CONFIG.background =
                    dataURL;

                saveConfig();


                backgroundImage.style.backgroundImage =
                    `url("${dataURL}")`;

                backgroundImage.style.filter =
                    `blur(${CONFIG.backgroundBlur}px)`;

                backgroundImage.style.transform =
                    "scale(1.03)";

                backgroundImage.style.opacity =
                    "1";


                backgroundFileName.textContent =
                    file.name;

            };


        reader.onerror =
            () => {

                alert(

                );

            };


        reader.readAsDataURL(

        );

    }
);


removeBackground.addEventListener(

        CONFIG.background =
            "";

        saveConfig();


        backgroundImage.style.backgroundImage =

        backgroundFile.value =

/* ============================================================
   CLOCK
   ============================================================ */

function updateClock() {

    const now =
        new Date();

    const showSeconds =
        CONFIG.seconds === true;

    const showMilliseconds =
        CONFIG.ms === true;


    let time =
        now.toLocaleTimeString(
            undefined,
            {

                hour:
                    "numeric",

                minute:
                    "2-digit",

                second:
                    showSeconds ||
                    showMilliseconds
                        ? "2-digit"
                        : undefined,

                hour12:
                    CONFIG.clock === "12"

            }
        );


    time =
        time.trim();


    if (
        showMilliseconds
    ) {

        const milliseconds =
            String(
                now.getMilliseconds()
            )
                .padStart(3, "0");


        time +=
            "." +
            milliseconds.toString().slice(0, 2);

    }


    time =
        time.replaceAll(
            "AM",
            ""
        );

    time =
        time.replaceAll(
            "PM",
            ""
        );

    time =
        time.replaceAll(
            " ",
            ""
        );


    clock.textContent =
        time;

}


let clockFrame =
    null;

let clockTimeout =
    null;


function startClock() {

    if (
        clockFrame !== null
    ) {

        cancelAnimationFrame(
            clockFrame
        );

        clockFrame =
            null;

    }


    if (
        clockTimeout !== null
    ) {

        clearTimeout(
            clockTimeout
        );

        clockTimeout =
            null;

    }


    updateClock();


    if (
        CONFIG.ms === true
    ) {

        const loop =
            () => {

                updateClock();

                clockFrame =
                    requestAnimationFrame(
                        loop
                    );

            };


        clockFrame =
            requestAnimationFrame(
                loop
            );

    } else {

        const loop =
            () => {

                updateClock();

                clockTimeout =
                    setTimeout(
                        loop,
                        CONFIG.seconds
                            ? 250
                            : 1000
                    );

            };


        clockTimeout =
            setTimeout(
                loop,
                CONFIG.seconds
                    ? 250
                    : 1000
            );

    }

}


/* ============================================================
   FAVICON
   ============================================================ */

function faviconURL(url) {

    try {

        const parsed =
            new URL(url);

        return (
            "https://www.google.com/s2/favicons" +
            "?domain=" +
            encodeURIComponent(
                parsed.hostname
            ) +
            "&sz=64"
        );

    } catch {

        return "";

    }

}


/* ============================================================
   SHORTCUT RENDERING
   ============================================================ */

function renderShortcuts() {

    shortcuts.innerHTML =
        "";


    CONFIG.shortcuts.forEach(
        (shortcut, index) => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "shortcut";

            card.draggable =
                true;

            card.dataset.index =
                index;


            const iconURL =
                faviconURL(
                    shortcut.url
                );


            prerenderURL(
                shortcut.url
            );


            const icon =
                document.createElement(
                    "div"
                );

            icon.className =
                "shortcut-icon";


            if (iconURL) {

                const image =
                    document.createElement(
                        "img"
                    );

                image.src =
                    iconURL;

                image.alt =
                    "";

                image.loading =
                    "lazy";

                image.decoding =
                    "async";


                image.onerror =
                    () => {

                        image.remove();

                        icon.innerHTML =
                            `<span class="shortcut-fallback">
                                ${escapeHTML(
                                    shortcut.name
                                        .charAt(0)
                                        .toUpperCase()
                                )}
                            </span>`;

                    };


                icon.appendChild(
                    image
                );

            } else {

                icon.innerHTML =
                    `<span class="shortcut-fallback">
                        ${escapeHTML(
                            shortcut.name
                                .charAt(0)
                                .toUpperCase()
                        )}
                    </span>`;

            }


            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "shortcut-name";

            name.textContent =
                shortcut.name;


            const url =
                document.createElement(
                    "div"
                );

            url.className =
                "shortcut-url";

            url.textContent =
                getHostname(
                    shortcut.url
                );


            const menu =
                document.createElement(
                    "button"
                );

            menu.className =
                "shortcut-menu";

            menu.textContent =
                "×";

            menu.title =
                "Remove shortcut";


            card.appendChild(
                icon
            );

            card.appendChild(
                name
            );

            card.appendChild(
                url
            );

            card.appendChild(
                menu
            );


            card.addEventListener(
                "click",
                event => {

                    if (
                        event.target === menu
                    ) {

                        return;

                    }

                    window.location.href =
                        shortcut.url;

                }
            );


            menu.addEventListener(
                "click",
                event => {

                    event.stopPropagation();


                    CONFIG.shortcuts.splice(
                        index,
                        1
                    );


                    saveConfig();

                    renderShortcuts();

                }
            );


            card.addEventListener(
                "dragstart",
                () => {

                    card.classList.add(
                        "dragging"
                    );

                }
            );


            card.addEventListener(
                "dragend",
                () => {

                    card.classList.remove(
                        "dragging"
                    );

                    rebuildShortcutOrder();

                }
            );


            card.addEventListener(
                "dragover",
                event => {

                    event.preventDefault();


                    const dragging =
                        document.querySelector(
                            ".shortcut.dragging"
                        );


                    if (
                        !dragging ||
                        dragging === card
                    ) {

                        return;

                    }


                    const rect =
                        card.getBoundingClientRect();


                    if (
                        event.clientX <
                        rect.left +
                        rect.width / 2
                    ) {

                        shortcuts.insertBefore(
                            dragging,
                            card
                        );

                    } else {

                        shortcuts.insertBefore(
                            dragging,
                            card.nextSibling
                        );

                    }

                }
            );


            shortcuts.appendChild(
                card
            );

        }
    );

}


/* ============================================================
   DRAG ORDER
   ============================================================ */

function rebuildShortcutOrder() {

    const elements =
        [
            ...shortcuts.children
        ];


    const old =
        CONFIG.shortcuts;


    CONFIG.shortcuts =
        elements.map(
            element => {

                return old[
                    Number(
                        element.dataset.index
                    )
                ];

            }
        );


    saveConfig();

    renderShortcuts();

}


/* ============================================================
   URL HELPERS
   ============================================================ */

function getHostname(url) {

    try {

        return new URL(url).hostname;

    } catch {

        return url;

    }

}


function escapeHTML(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


function validHex(value) {

    return /^#[0-9a-fA-F]{6}$/
        .test(
            value
        );

}


function looksLikeURL(input) {

    input =
        input.trim();


    if (!input) {

        return false;

    }


    if (
        /^[a-z][a-z0-9+.-]*:\/\//i
            .test(input)
    ) {

        return true;

    }


    if (
        /^localhost(?::\d+)?(?:\/.*)?$/i
            .test(input)
    ) {

        return true;

    }


    if (
        /^(?:\d{1,3}\.){3}\d{1,3}(?::\d+)?(?:\/.*)?$/
            .test(input)
    ) {

        return true;

    }


    if (
        /^[^\s/]+\.[^\s/]+(?:\/.*)?$/
            .test(input)
    ) {

        return true;

    }


    return false;

}


function normalizeURL(input) {

    input =
        input.trim();


    if (
        !/^[a-z][a-z0-9+.-]*:\/\//i
            .test(input)
    ) {

        input =
            "https://" + input;

    }


    try {

        return new URL(input).href;

    } catch {

        return null;

    }

}


function resolveOmniboxInput(input) {

    input =
        input.trim();


    if (!input) {

        return null;

    }


    if (
        /^[a-z][a-z0-9+.-]*:\/\//i
            .test(input)
    ) {

        const url =
            normalizeURL(
                input
            );


        if (url) {

            return {

                type:
                    "url",

                url

            };

        }

    }


    if (
        looksLikeURL(
            input
        )
    ) {

        const url =
            normalizeURL(
                input
            );


        if (url) {

            return {

                type:
                    "url",

                url

            };

        }

    }


    return {

        type:
            "search",

        url:
            CONFIG.searchEngine +
            encodeURIComponent(
                input
            )

    };

}


/* ============================================================
   SPECULATION / PRERENDER
   ============================================================ */

let currentSpeculationURL =
    null;


function prerenderURL(url) {

    if (!url) {
        return;
    }


    if (
        !HTMLScriptElement.supports ||
        !HTMLScriptElement.supports(
            "speculationrules"
        )
    ) {

        return;

    }


    if (
        currentSpeculationURL ===
        url
    ) {

        return;

    }


    currentSpeculationURL =
        url;


    const script =
        document.createElement(
            "script"
        );


    script.type =
        "speculationrules";


    script.textContent =
        JSON.stringify({

            prerender: [

                {

                    urls:
                        [url],

                    eagerness:
                        "moderate"

                }

            ]

        });


    document.head.appendChild(
        script
    );

}


/* ============================================================

   ============================================================ */

let typingTimer =
    null;


searchInput.addEventListener(
    "input",
    () => {

        clearTimeout(
            typingTimer
        );


        const input =
            searchInput.value.trim();


        if (!input) {

            currentSpeculationURL =
                null;

            return;

        }


        typingTimer =
            setTimeout(
                () => {

                    const result =
                        resolveOmniboxInput(
                            input
                        );


                    if (
                        !result ||
                        result.type !== "url"
                    ) {

                        return;

                    }


                    prerenderURL(
                        result.url
                    );

                },
                250
            );

    }
);


searchForm.addEventListener(
    "submit",
    event => {

        event.preventDefault();


        const input =
            searchInput.value.trim();


        if (!input) {
            return;
        }


        const result =
            resolveOmniboxInput(
                input
            );


        if (!result) {
            return;
        }


        window.location.href =
            result.url;

    }
);


searchInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Escape"
        ) {

            searchInput.value =
                "";

            searchInput.blur();

            currentSpeculationURL =
                null;

            return;

        }


        if (
            event.key === "Enter" &&
            event.shiftKey
        ) {

            event.preventDefault();


            const input =
                searchInput.value.trim();


            if (!input) {
                return;
            }


            const result =
                resolveOmniboxInput(
                    input
                );


            if (!result) {
                return;
            }


            window.open(
                result.url,
                "_blank"
            );

        }

    }
);

/* ============================================================
   COLOR BINDING
   ============================================================ */

function bindColor(
    textElement,
    pickerElement,
    cssVariable
) {

    pickerElement.addEventListener(
        "input",
        () => {

            textElement.value =
                pickerElement.value;


            root.style.setProperty(
                cssVariable,
                pickerElement.value
            );

        }
    );


    textElement.addEventListener(
        "input",
        () => {

            if (
                validHex(
                    textElement.value
                )
            ) {

                pickerElement.value =
                    textElement.value;


                root.style.setProperty(
                    cssVariable,
                    textElement.value
                );

            }

        }
    );

}


bindColor(
    accentSetting,
    accentPicker,
    "--accent"
);


/* ============================================================
   ORB COLOR EDITOR
   ============================================================ */

function renderOrbColorEditor() {

    orbColors.innerHTML =
        "";


    CONFIG.orbColors.forEach(
        (color, index) => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "orb-color";


            const number =
                document.createElement(
                    "div"
                );

            number.className =
                "orb-color-number";

            number.textContent =
                index + 1;


            const text =
                document.createElement(
                    "input"
                );

            text.type =
                "text";

            text.value =
                color;

            text.maxLength =
                7;

            text.spellcheck =
                false;

            text.setAttribute(
                "aria-label",
                `Orb color ${index + 1}`
            );


            const picker =
                document.createElement(
                    "input"
                );

            picker.type =
                "color";

            picker.value =
                validHex(color)
                    ? color
                    : "#ffffff";


            picker.addEventListener(
                "input",
                () => {

                    CONFIG.orbColors[index] =
                        picker.value;

                    text.value =
                        picker.value;

                    buildOrbGradients(
                        CONFIG.orbColors
                    );

                }
            );


            text.addEventListener(
                "input",
                () => {

                    if (
                        validHex(
                            text.value
                        )
                    ) {

                        CONFIG.orbColors[index] =
                            text.value;

                        picker.value =
                            text.value;

                        buildOrbGradients(
                            CONFIG.orbColors
                        );

                    }

                }
            );


            row.appendChild(
                number
            );

            row.appendChild(
                text
            );

            row.appendChild(
                picker
            );


            orbColors.appendChild(
                row
            );

        }
    );


    colorCount.textContent =
        `${CONFIG.orbColors.length} of 8 colors`;


    addOrbColor.disabled =
        CONFIG.orbColors.length >= 8;


    removeOrbColor.disabled =
        CONFIG.orbColors.length <= 1;

}


addOrbColor.addEventListener(
    "click",
    () => {

        if (
            CONFIG.orbColors.length >= 8
        ) {

            return;

        }


        const palette = [

            "#ff3b30",
            "#ff9500",
            "#ffcc00",
            "#34c759",
            "#00c7be",
            "#5856d6",
            "#af52de",
            "#ff2d55"

        ];


        const newColor =
            palette[
                CONFIG.orbColors.length %
                palette.length
            ];


        CONFIG.orbColors.push(
            newColor
        );


        renderOrbColorEditor();

        buildOrbGradients(
            CONFIG.orbColors
        );

    }
);


removeOrbColor.addEventListener(
    "click",
    () => {

        if (
            CONFIG.orbColors.length <= 1
        ) {

            return;

        }


        CONFIG.orbColors.pop();


        renderOrbColorEditor();

        buildOrbGradients(
            CONFIG.orbColors
        );

    }
);

    orbGlowValue.textContent =

    orbXSetting.value =

    orbXValue.textContent =
        CONFIG.orbX + "%";


    orbYSetting.value =
        CONFIG.orbY;

    orbYValue.textContent =

        CONFIG.backgroundBlur;

        CONFIG.backgroundBlur + "px";


    clockSetting.value =
        CONFIG.clock;

        CONFIG.seconds
            ? "yes"
            : "no";

        CONFIG.ms
            ? "yes"
            : "no";


    settingsPanel.classList.add(
        "open"
    );

    overlay.classList.add(
        "open"
    );

}


function closeSettings() {

    settingsPanel.classList.remove(
        "open"
    );


    if (
        !shortcutDialog.classList.contains(
            "open"
        )
    ) {

        overlay.classList.remove(
            "open"
        );

    }

}

/* ============================================================
   SAVE SETTINGS
   ============================================================ */

document.getElementById(
    "saveSettings"
).addEventListener(
    "click",
    () => {

        CONFIG.logo =
            logoSetting.value.trim()
            ||
            DEFAULT_CONFIG.logo;


        CONFIG.searchEngine =
            searchSetting.value.trim()
            ||
            DEFAULT_CONFIG.searchEngine;


        CONFIG.accent =
            validHex(
                accentSetting.value
            )
                ? accentSetting.value
                : DEFAULT_CONFIG.accent;


        CONFIG.transparency =
            Number(
                transparencySetting.value
            );


        CONFIG.blur =
            Number(
                blurSetting.value
            );


        CONFIG.orbColors =
            CONFIG.orbColors
                .filter(validHex)
                .slice(0, 8);


        if (
            CONFIG.orbColors.length === 0
        ) {

            CONFIG.orbColors = [
                DEFAULT_CONFIG.orbColors[0]
            ];

        }


        CONFIG.orbSize =
            Number(
                orbSizeSetting.value
            );


        CONFIG.orbOpacity =
            Number(
                orbOpacitySetting.value
            );


        CONFIG.orbSoftness =
            Number(
                orbSoftnessSetting.value
            );


        CONFIG.orbGlow =
            Number(
                orbGlowSetting.value
            );


        CONFIG.orbX =
            Number(
                orbXSetting.value
            );


        CONFIG.orbY =
            Number(
                orbYSetting.value
            );


        CONFIG.backgroundBlur =
            Number(
                backgroundBlurSetting.value
            );


        CONFIG.clock =
            clockSetting.value;


        CONFIG.seconds =
            secondsSetting.value ===
            "yes";


        CONFIG.ms =
            msSetting.value ===
            "yes";


        saveConfig();

        applyConfig();

        closeSettings();

    }
);

/* ============================================================
   ADD SHORTCUT
   ============================================================ */

function openShortcutDialog() {

    document.getElementById(
        "shortcutName"
    ).value = "";


    document.getElementById(
        "shortcutURL"
    ).value = "";


    shortcutDialog.classList.add(
        "open"
    );


    overlay.classList.add(
        "open"
    );


    document.getElementById(
        "shortcutName"
    ).focus();

}

    shortcutDialog.classList.remove(
        "open"
    );


    if (
        !settingsPanel.classList.contains(
            "open"
        )
    ) {

        overlay.classList.remove(
            "open"
        );

    }

    "addButton"

);


document.getElementById(
    "cancelShortcut"
).addEventListener(
    "click",
    closeShortcutDialog
);


document.getElementById(
    "createShortcut"
).addEventListener(
    "click",
    () => {

        const name =
            document.getElementById(
                "shortcutName"
            ).value.trim();


        let url =
            document.getElementById(
                "shortcutURL"
            ).value.trim();


        if (
            !name ||
            !url
        ) {

            alert(
                "Enter a name and URL."
            );

            return;

        }


        if (
            !/^https?:\/\//i.test(
                url
            )
        ) {

            url =
                "https://" + url;

        }


        CONFIG.shortcuts.push({

            name,
            url

        });


        saveConfig();

        renderShortcuts();

        closeShortcutDialog();

    }
);


/* ============================================================
   OVERLAY
   ============================================================ */

overlay.addEventListener(
    "click",
    () => {

        closeSettings();

        closeShortcutDialog();

    }
);


/* ============================================================
   KEYBOARD
   ============================================================ */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "/" &&
            document.activeElement !==
            searchInput
        ) {

            event.preventDefault();

            searchInput.focus();

        }


        if (
            event.key === "Escape"
        ) {

            closeSettings();

            closeShortcutDialog();

        }

    }
);


/* ============================================================
   INITIALIZE
   ============================================================ */

applyConfig();
